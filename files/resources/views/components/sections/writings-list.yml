# The visual editor's contract for sections/writings-list.blade.php. The rows
# come from resources/data/collections/writing.json via the page's bound
# items attribute — edit essays there.
title: Writings list
description: Hairlined essay rows with mono dates and read times — fed by the writing collection
fields:
    label:
        type: text
        label: Index label
        description: The small mono line above the heading. Leave empty to hide.
        default: ""
    heading:
        type: text
        label: Heading
        description: Leave empty to hide the heading row.
        default: ""
    featuredOnly:
        type: toggle
        label: Featured writings only
        description: Show only entries flagged featured in the writing collection.
        default: ""
    showDescription:
        type: toggle
        label: Show descriptions
        default: ""
    showAll:
        type: toggle
        label: Show the all-writings link
        default: ""
    allText:
        type: text
        label: All-writings link text
        default: "All writings"
    allLink:
        type: url
        label: All-writings link
        default: "/writings"
