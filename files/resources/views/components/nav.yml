# The visual editor's contract for components/nav.blade.php — these fields
# surface under the Layout tab. Field names are camelCase, matching the props
# they fill. The links repeater stores into site.json's nav_links key via the
# layout's bound attribute.
title: Navigation
description: The floating header — user card, links, and the contact button, which collapse into a pill on scroll
fields:
    brand:
        type: text
        label: Name
        default: "Kai Sato"
    avatar:
        type: image
        label: Avatar
        default: "https://assets.ui.sh/avatars/3.webp?size=160"
    avatarAlt:
        type: text
        label: Avatar alt text
        default: "Portrait of Kai Sato"
    showStatus:
        type: toggle
        label: Show availability
        default: "1"
    statusText:
        type: text
        label: Availability text
        default: "Available for work"
    links:
        type: repeater
        label: Navigation links
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
    showCta:
        type: toggle
        label: Show contact button
        default: "1"
    ctaText:
        type: text
        label: Button text
        default: "Get in touch"
    ctaLink:
        type: url
        label: Button link
        default: "mailto:hello@kaisato.dev"
